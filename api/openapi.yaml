openapi: 3.1.0
info:
  title: Nuvex API
  version: 0.1.0
  description: >
    Read model for operators and dashboards. Responses are not protocol truth.
    Finalized results come from Solana accounts. GET /health returns authority: none.
    Requests, nodes, and network counts are served from the indexer store.
    GET /v1/prices returns a median of fresh public observations. That median is not a chain result.
    Jobs and models stay unimplemented.
paths:
  /health:
    get:
      summary: Process health
      responses:
        "200":
          description: Process is up and is not a chain authority.
  /live:
    get:
      summary: Liveness
      responses:
        "200":
          description: Process is up.
  /ready:
    get:
      summary: Readiness of the HTTP process
      responses:
        "200":
          description: The process can answer health checks. Read-model availability is reported separately.
  /v1/requests:
    get:
      summary: Indexed requests
      responses:
        "200":
          description: Indexed request accounts. An empty list means none were observed.
        "503":
          description: No read model is configured.
  /v1/requests/{id}:
    get:
      summary: One indexed request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The indexed row.
        "404":
          description: No indexed row. The account may still exist on chain.
        "503":
          description: No read model is configured.
  /v1/nodes:
    get:
      summary: Indexed nodes
      responses:
        "200":
          description: Indexed node accounts. An empty list means none were observed.
        "503":
          description: No read model is configured.
  /v1/jobs:
    get:
      responses:
        "501":
          description: Not a Milestone 4 read.
  /v1/models:
    get:
      responses:
        "501":
          description: Not a Milestone 4 read.
  /v1/prices:
    get:
      summary: Median of fresh public observations
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
          description: SOL/USD, BTC/USD, ETH/USD, or the same assets quoted in USDT.
        - name: maxAgeMs
          in: query
          schema:
            type: integer
            minimum: 1000
            maximum: 300000
        - name: minimumSources
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        "200":
          description: Enough fresh observations. authority is none.
        "400":
          description: Unknown symbol or invalid query bounds.
        "422":
          description: Not enough fresh observations. No median is invented.
  /v1/network:
    get:
      summary: Indexed counts
      responses:
        "200":
          description: Counts from the read model. Not latency and not protocol truth.
        "503":
          description: No read model is configured.
